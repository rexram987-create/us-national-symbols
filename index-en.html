<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Symbols Archive | United States</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: { 900: '#0a192f', 800: '#112240', 700: '#233554' },
                        gold: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' },
                    },
                    fontFamily: {
                        sans: ['Heebo', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Heebo', sans-serif; }
        h1, h2, h3, .serif-font { font-family: 'Playfair Display', serif; }
        .bg-pattern { background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); }
    </style>
</head>
<body class="bg-navy-900 text-slate-300 min-h-screen bg-pattern selection:bg-gold-500 selection:text-navy-900">
    <div id="root"></div>

    <script type="text/babel">
        // Symbol Data Array - English version with 14 symbols
        const symbolsData = [
            {
                id: 'declaration',
                category: 'vision',
                title: `Declaration of Independence`,
                year: `1776`,
                description: `The founding document that created the American Creed, spearheaded by Thomas Jefferson.`,
                icon: `scroll`,
                image: `assets/images/symbols/declaration-signatures.webp`,
                link: `symbols/declaration-en.html`,
                isNew: false
            },
            {
                id: 'constitution',
                category: 'vision',
                title: `The U.S. Constitution`,
                year: `1787`,
                description: `The supreme civic symbol and sacred contract of the Republic, engineered by James Madison.`,
                icon: `scale`,
                image: `assets/images/symbols/constitution-document.webp`,
                link: `symbols/constitution-en.html`,
                isNew: false
            },
            {
                id: 'motto',
                category: 'vision',
                title: `The National Motto`,
                year: `1956`,
                description: `In God We Trust - its historical roots, theological meaning, and the religious battles surrounding it.`,
                icon: `quote`,
                image: `assets/images/symbols/great-seal-us.svg`,
                link: `symbols/motto-en.html`,
                isNew: false
            },
            {
                id: 'flag',
                category: 'identity',
                title: `The American Flag`,
                year: `1777`,
                description: `The history, the Betsy Ross myth, and the evolution of the 'Stars and Stripes'.`,
                icon: `flag`,
                image: `assets/images/symbols/us-flag-official.svg`,
                link: `symbols/american-flag-en.html`,
                isNew: false
            },
            {
                id: 'anthem',
                category: 'identity',
                title: `The National Anthem`,
                year: `1814`,
                description: `'The Star-Spangled Banner' - a poem born in the heart of a bloody naval battle during the War of 1812.`,
                icon: `music`,
                image: `assets/images/symbols/independence-hall.jpeg`,
                link: `symbols/national-anthem-en.html`,
                isNew: false
            },
            {
                id: 'seal',
                category: 'identity',
                title: `The Great Seal`,
                year: `1782`,
                description: `The official emblem combining the eagle, olive branches, and arrows. The engineering behind the seal.`,
                icon: `stamp`,
                image: `assets/images/symbols/great-seal-us.svg`,
                link: `symbols/great-seal-en.html`,
                isNew: false
            },
            {
                id: 'uncle-sam',
                category: 'identity',
                title: `Uncle Sam`,
                year: `1812`,
                description: `From an unknown New York meatpacker to the world's most famous recruitment icon designed by James Flagg.`,
                icon: `user-circle`,
                image: `assets/images/symbols/uncle-sam-icon.jpg`,
                link: `symbols/uncle-sam-en.html`,
                isNew: false
            },
            {
                id: 'eagle',
                category: 'nature',
                title: `The Bald Eagle`,
                year: `1782`,
                description: `The national bird symbolizing freedom and strength. Includes the historical dispute with Benjamin Franklin.`,
                icon: `bird`,
                image: `assets/images/symbols/bald-eagle-portrait-majestic.webp`,
                link: `symbols/bald-eagle-en.html`,
                isNew: false
            },
            {
                id: 'bison',
                category: 'nature',
                title: `The American Bison`,
                year: `2016`,
                description: `The national mammal. A symbol of prairie majesty, the tragedy of near-extinction, and conservation efforts.`,
                icon: `paw-print`,
                image: `assets/images/symbols/american-bison-rugged-realism.webp`,
                link: `symbols/american-bison-en.html`,
                isNew: false
            },
            {
                id: 'oak-tree',
                category: 'nature',
                title: `The Oak Tree`,
                year: `2004`,
                description: `The national tree symbolizing strength, endurance, and deep roots in American soil.`,
                icon: `tree-pine`,
                image: `assets/images/symbols/american-oak-bark-acorn.webp`,
                link: `symbols/oak-tree-en.html`,
                isNew: false
            },
            {
                id: 'rose',
                category: 'nature',
                title: `The Rose`,
                year: `1986`,
                description: `The national floral emblem of the US, symbolizing life, love, and devotion. Declared in the Rose Garden.`,
                icon: `flower-2`,
                image: `assets/images/symbols/american-national-rose-deep-red.webp`,
                link: `symbols/rose-en.html`,
                isNew: false
            },
            {
                id: 'apple-pie',
                category: 'nature',
                title: `Apple Pie`,
                year: `1800s`,
                description: `The unofficial culinary symbol of the United States - 'As American as apple pie'.`,
                icon: `chef-hat`,
                image: `assets/images/symbols/apple-pie-icon.jpg`,
                link: `symbols/apple-pie-en.html`,
                isNew: false
            },
            {
                id: 'wild-turkey',
                category: 'nature',
                title: `The Wild Turkey`,
                year: `1784`,
                description: `The original American bird: from the pioneers' feast, to Benjamin Franklin's myth, to the greatest linguistic confusion in history.`,
                icon: `bird`,
                image: `assets/images/symbols/wild-turkey-nature.webp`,
                link: `symbols/wild-turkey-en.html`,
                isNew: false
            },
            {
                id: 'mustang',
                category: 'nature',
                title: `The Mustang`,
                year: `1971`,
                description: `Ghost of the plains: the Spanish horse that went feral, conquered the West, and became the symbol of American freedom.`,
                icon: `sun`,
                image: `assets/images/symbols/mustang-wild.webp`,
                link: `symbols/mustang-en.html`,
                isNew: true
            }
        ];

        // Component: Individual Card with Header Image
        const SymbolCard = ({ symbol }) => {
            React.useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [symbol]);

            return (
                <a href={symbol.link} className="group relative bg-navy-800/80 backdrop-blur-md border border-navy-600 rounded-2xl overflow-hidden flex flex-col h-full transition-all duration-300 hover:border-gold-500 hover:shadow-[0_0_20px_rgba(251,191,36,0.15)] hover:-translate-y-1 block">
                    <div className="relative h-48 w-full overflow-hidden bg-navy-900">
                        <img 
                            src={symbol.image} 
                            alt={symbol.title} 
                            className="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-700"
                            loading="lazy"
                            onError={(e) => { 
                                e.target.onerror = null; 
                                e.target.src = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200"><rect width="400" height="200" fill="%23112240"/><text x="50%" y="50%" font-family="sans-serif" font-size="14" fill="%23fbbf24" text-anchor="middle" dominant-baseline="middle">Asset Not Found in GitHub</text></svg>`; 
                            }}
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-navy-800 via-navy-800/20 to-transparent"></div>
                        {symbol.isNew && (
                            <div className="absolute top-3 right-3 bg-gold-500 text-navy-900 text-xs font-bold px-3 py-1 rounded-full shadow-lg border-2 border-navy-900 z-10 animate-pulse">
                                New!
                            </div>
                        )}
                        <div className="absolute top-3 left-3 p-2 bg-navy-900/80 backdrop-blur-sm rounded-xl border border-navy-700 text-gold-400 group-hover:bg-gold-500 group-hover:text-navy-900 transition-colors shadow-lg z-10">
                            <i data-lucide={symbol.icon} className="w-5 h-5"></i>
                        </div>
                    </div>

                    <div className="p-6 flex flex-col flex-grow bg-navy-800/80">
                        <div className="flex items-center justify-between mb-3">
                            <h3 className="text-xl font-bold text-white group-hover:text-gold-400 transition-colors">
                                {symbol.title}
                            </h3>
                            <span className="text-xs font-bold text-navy-400 bg-navy-900/50 px-3 py-1 rounded-full border border-navy-700/50">
                                {symbol.year}
                            </span>
                        </div>
                        <p className="text-slate-400 text-sm leading-relaxed mb-6 flex-grow">
                            {symbol.description}
                        </p>
                        <div className="flex items-center text-gold-500 font-medium text-sm group-hover:translate-x-4 transition-transform w-fit mt-auto pt-4 border-t border-navy-700/50 w-full">
                            Read full research
                            <i data-lucide="arrow-right" className="w-4 h-4 ml-1"></i>
                        </div>
                    </div>
                </a>
            );
        };

        const CategorySection = ({ title, icon, symbols }) => (
            <section className="mb-16">
                <div className="flex items-center gap-3 mb-8 border-b border-navy-700/50 pb-4">
                    <div className="p-2 bg-navy-800 rounded-lg text-gold-500 shadow-sm border border-navy-600">
                        <i data-lucide={icon} className="w-6 h-6"></i>
                    </div>
                    <h2 className="text-3xl font-bold text-white">{title}</h2>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {symbols.map(sym => <SymbolCard key={sym.id} symbol={sym} />)}
                </div>
            </section>
        );

        const App = () => {
            React.useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, []);

            const visionSymbols = symbolsData.filter(s => s.category === 'vision');
            const identitySymbols = symbolsData.filter(s => s.category === 'identity');
            const natureSymbols = symbolsData.filter(s => s.category === 'nature');

            return (
                <div className="min-h-screen">
                    <header className="absolute top-0 left-0 right-0 z-50 bg-navy-900/90 backdrop-blur-md border-b border-gold-500/20 shadow-lg">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-4">
                                <div className="p-2 bg-gold-500 text-navy-900 rounded-full shadow-[0_0_15px_rgba(251,191,36,0.5)]">
                                    <i data-lucide="library" className="w-6 h-6"></i>
                                </div>
                                <div>
                                    <h1 className="text-xl md:text-2xl font-bold text-white tracking-wide">National Symbols Archive</h1>
                                    <p className="text-xs md:text-sm text-gold-400 font-medium">United States of America</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-4">
                                <a href="index.html" className="flex items-center justify-center w-10 h-10 bg-navy-800 text-white rounded-full font-bold hover:bg-gold-500 hover:text-navy-900 transition-colors border border-navy-700 shadow-sm" title="Hebrew">
                                    HE
                                </a>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 pt-32 pb-24">
                        <div className="text-center mb-16 relative">
                            <div className="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-1 bg-gradient-to-r from-transparent via-gold-500 to-transparent opacity-50"></div>
                            <h2 className="text-4xl md:text-5xl font-bold text-white mb-4 mt-6 leading-tight">Explore American Heritage</h2>
                            <p className="text-lg md:text-xl text-slate-400 max-w-2xl mx-auto font-light">
                                A comprehensive collection of historical and etymological research on the symbols that define the United States.
                            </p>
                        </div>

                        <CategorySection title="The Vision & The Law" icon="scale" symbols={visionSymbols} />
                        <CategorySection title="National Identity & History" icon="flag" symbols={identitySymbols} />
                        <CategorySection title="Nature, Folklore & Culture" icon="leaf" symbols={natureSymbols} />
                    </main>

                    <footer className="bg-navy-900/90 border-t border-navy-700 py-8">
                        <div className="max-w-7xl mx-auto px-4 text-center text-slate-500 text-sm">
                            <p>© 2026 National Symbols Archive. Built by Ram.</p>
                            <p className="mt-2 text-xs">Optimized for Samsung S25 Ultra</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
