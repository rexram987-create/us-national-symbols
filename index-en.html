<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>National Symbols | United States of America</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBase: '#0a0a0a',
                        darkSurface: '#171717',
                        darkBorder: '#262626',
                        brandAccent: '#dc2626',
                        brandBlue: '#1e3a8a',
                    },
                    fontFamily: {
                        sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { background-color: #0a0a0a; color: #e5e7eb; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; font-family: system-ui, -apple-system, sans-serif; }
        .glass-effect { background: rgba(23, 23, 23, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    </style>
</head>
<body class="selection:bg-brandAccent selection:text-white transition-colors duration-300">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const symbols = [
            { id: 'seal', name: 'The Great Seal', year: '1782', path: 'symbols/great-seal-en.html', img: 'assets/images/symbols/great-seal-us.svg', desc: 'The official symbol of the federal government, approved in 1782 after complex research.', isNew: false, objectFit: 'contain p-4 drop-shadow-xl', hoverBorder: 'hover:border-brandBlue', textHover: 'group-hover:text-brandBlue', bgClass: 'bg-gray-800' },
            { id: 'flag', name: 'The American Flag', year: '1777', path: 'symbols/american-flag-en.html', img: 'assets/images/symbols/us-flag-official.svg', desc: 'The full research: History, etymology, Francis Hopkinson, and the legend of Betsy Ross.', isNew: false, objectFit: 'cover opacity-80 group-hover:opacity-100', hoverBorder: 'hover:border-brandAccent', textHover: 'group-hover:text-brandAccent', bgClass: 'bg-gray-900' },
            { id: 'anthem', name: 'The National Anthem', year: '1814', path: 'symbols/national-anthem-en.html', img: 'assets/images/symbols/star-spangled-banner-parchment.webp', desc: 'The full research: Francis Scott Key, the lyrics, and the reason for censoring the three stanzas.', isNew: false, objectFit: 'cover opacity-70 group-hover:opacity-100', hoverBorder: 'hover:border-indigo-400', textHover: 'group-hover:text-indigo-400', bgClass: 'bg-gray-900' },
            { id: 'eagle', name: 'The Bald Eagle', year: '1782', path: 'symbols/bald-eagle-en.html', img: 'assets/images/symbols/bald-eagle-portrait-majestic.webp', desc: 'The full research: Etymology, the designers, and the famous polemic of Franklin.', isNew: false, objectFit: 'cover opacity-70 group-hover:opacity-100', hoverBorder: 'hover:border-yellow-500', textHover: 'group-hover:text-yellow-500', bgClass: 'bg-gray-900' },
            { id: 'bison', name: 'American Bison', year: '2016', path: 'symbols/american-bison-en.html', img: 'assets/images/symbols/american-bison-rugged-realism.webp', desc: 'The heritage symbol of the Frontier and the survival of the United States.', isNew: false, objectFit: 'cover opacity-70 group-hover:opacity-100', hoverBorder: 'hover:border-yellow-700', textHover: 'group-hover:text-yellow-700', bgClass: 'bg-gray-800' },
            { id: 'rose', name: 'The National Rose', year: '1986', path: 'symbols/rose-en.html', img: 'assets/images/symbols/american-national-rose-deep-red.webp', desc: 'The official floral emblem representing life, love, and devotion.', isNew: false, objectFit: 'cover opacity-70 group-hover:opacity-100', hoverBorder: 'hover:border-red-500', textHover: 'group-hover:text-red-500', bgClass: 'bg-gray-800' },
            { id: 'oak', name: 'The American Oak', year: '2004', path: 'symbols/oak-tree-en.html', img: 'assets/images/symbols/american-oak-bark-acorn.webp', desc: 'The symbol of strength, durability, and stability in the United States.', isNew: false, objectFit: 'cover opacity-70 group-hover:opacity-100', hoverBorder: 'hover:border-green-600', textHover: 'group-hover:text-green-600', bgClass: 'bg-gray-800' },
            { id: 'unclesam', name: 'Uncle Sam', year: '1961', path: 'symbols/uncle-sam-en.html', img: 'assets/images/symbols/uncle-sam-icon.jpg', desc: 'Personification of the Nation. From a meat packer to the most influential recruitment poster.', isNew: true, objectFit: 'cover object-top opacity-80 group-hover:opacity-100', hoverBorder: 'hover:border-brandAccent', textHover: 'group-hover:text-brandAccent', bgClass: 'bg-gray-900' }
        ];

        function App() {
            const [showProfileModal, setShowProfileModal] = useState(false);

            return (
                <div className="flex flex-col min-h-screen">
                    
                    {/* Header */}
                    <header className="border-b border-darkBorder glass-effect">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-4">
                                <div className="w-10 h-10 rounded-full bg-brandBlue flex items-center justify-center border-2 border-brandAccent shadow-lg overflow-hidden">
                                    <span className="text-white font-bold text-xl">US</span>
                                </div>
                                <h1 className="text-xl sm:text-2xl font-extrabold tracking-tight text-white">American National Symbols</h1>
                            </div>
                            <nav className="hidden sm:flex items-center gap-6 font-medium">
                                <a href="index-en.html" className="text-brandAccent hover:text-red-400 transition-colors">Home</a>
                                <a href="about-en.html" className="text-gray-400 hover:text-white transition-colors">About</a>
                                <a href="index.html" className="flex items-center gap-1 px-3 py-1.5 rounded-full bg-darkBase border border-darkBorder hover:border-brandAccent text-gray-300 hover:text-white transition-all shadow-sm">
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    <span className="text-xs font-bold uppercase tracking-wider">HE</span>
                                </a>
                            </nav>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex flex-col gap-16">
                        
                        <section className="bg-darkSurface border border-darkBorder rounded-2xl p-6 sm:p-10 shadow-2xl">
                            <h2 className="text-3xl sm:text-4xl font-bold text-white mb-6 border-b-2 border-brandAccent pb-4 inline-block">Historical Introduction: Birth of a Visual Identity</h2>
                            
                            <div className="space-y-6 text-lg leading-relaxed text-gray-300">
                                <p>
                                    Examining the national symbols of the United States is not merely a review of graphic designs or plants and animals, but a deep journey into the cultural, political, and social DNA of the nation. From its birth in the storm of the Revolutionary War (1775–1783), the United States faced an enormous challenge: How to unite thirteen distinct colonies, with differing economic interests and diverse demographics, into a single Republic under a shared national identity?
                                </p>
                                <p>
                                    The answer lies largely in symbols. The Founding Fathers understood that to create loyalty to a new country that lacked a king or a long history like European nations, a system of visual symbols had to be created to serve as a cultural glue. These symbols were intended to reflect ideals of liberty, justice, power, independence, and unity.
                                </p>
                                <p>
                                    From the Great Seal, whose design took six long years and involved three different committees to reach the required symbolic precision, to the decision to adopt the Bald Eagle as a symbol of power and liberty despite certain objections (such as Benjamin Franklin's famous critique). Every symbol holds stories of individuals, ideological struggles, and fateful decisions. This project invites you to explore the history, exact etymology, and identity behind each symbol, and to understand how "Out of many, one" (E Pluribus Unum) transformed from a catchphrase into a national reality.
                                </p>
                            </div>
                        </section>

                        {}
                        <section>
                            <h3 className="text-2xl font-bold text-white mb-8">Index of National Symbols</h3>
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                {symbols.map((symbol) => (
                                    <a 
                                        key={symbol.id} 
                                        href={symbol.path} 
                                        className={`group bg-darkSurface rounded-xl overflow-hidden border border-darkBorder ${symbol.hoverBorder} transition-all duration-300 hover:-translate-y-1 shadow-lg block relative`}
                                    >
                                        {symbol.isNew && (
                                            <div className="absolute top-0 right-0 bg-brandAccent text-white text-xs font-bold px-3 py-1 rounded-bl-lg z-20 shadow-md">NEW</div>
                                        )}
                                        <div className={`h-48 ${symbol.bgClass} flex items-center justify-center overflow-hidden relative`}>
                                            <img 
                                                src={symbol.img} 
                                                alt={symbol.name} 
                                                className={`w-full h-full relative z-0 transition-transform duration-500 group-hover:scale-110 ${symbol.objectFit}`} 
                                            />
                                            <div className="absolute inset-0 bg-gradient-to-t from-darkSurface via-darkSurface/50 to-transparent z-10"></div>
                                            <div className="absolute bottom-3 right-3 bg-brandBlue text-white text-xs font-bold px-2 py-1 rounded z-20">{symbol.year}</div>
                                        </div>
                                        <div className="p-6 relative z-20">
                                            <h4 className={`text-xl font-bold text-white transition-colors ${symbol.textHover}`}>{symbol.name}</h4>
                                            <p className="text-sm text-gray-400 mt-2">{symbol.desc}</p>
                                        </div>
                                    </a>
                                ))}
                            </div>
                        </section>

                        {/* Researcher Section */}
                        <section className="bg-darkSurface border border-darkBorder rounded-2xl p-6 sm:p-10 shadow-2xl flex flex-col sm:flex-row items-center gap-8 text-center sm:text-left">
                            <button 
                                type="button" 
                                onClick={() => setShowProfileModal(true)}
                                className="w-32 h-32 sm:w-40 sm:h-40 flex-shrink-0 rounded-full overflow-hidden border-4 border-brandBlue shadow-2xl hover:border-brandAccent transition-colors duration-300 group focus:outline-none focus:ring-4 focus:ring-brandAccent cursor-pointer" 
                                aria-label="Open full profile picture"
                            >
                                <img src="assets/images/symbols/ram-profile.jpg" alt="Ram, American symbols researcher" className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300" />
                            </button>
                            
                            <div className="flex-grow">
                                <h3 className="text-2xl sm:text-3xl font-bold text-white mb-3">Meet the Researcher</h3>
                                <p className="text-lg text-gray-300 leading-relaxed mb-4">
                                    The project was researched and developed by Ram. A researcher and bibliophile dedicating his time to in-depth reading of history books, science, biographies, and historical novels, combined with advanced artificial intelligence research tools, aiming to make American heritage accessible without compromises or shortcuts.
                                </p>
                                <a href="about-en.html" className="inline-block text-brandAccent hover:text-red-400 font-medium transition-colors text-lg border-b border-brandAccent pb-1">
                                    Read the full About page &rarr;
                                </a>
                            </div>
                        </section>

                    </main>

                    {/* Footer */}
                    <footer className="bg-darkSurface border-t border-darkBorder mt-auto">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col sm:flex-row items-center justify-between gap-4">
                            <p class="text-gray-500 text-sm">
                                &copy; Meticulously built and researched. All rights reserved to the American Symbols Research Project.
                            </p>
                            <div class="flex gap-4">
                                <a href="about-en.html" class="text-sm text-gray-400 hover:text-white transition-colors">About (Ram)</a>
                            </div>
                        </div>
                    </footer>

                    {}
                    <div className="sm:hidden fixed bottom-0 left-0 right-0 bg-darkSurface border-t border-darkBorder p-4 flex justify-around z-50">
                        <a href="index-en.html" className="text-brandAccent font-medium flex flex-col items-center">
                            <svg className="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                            Home
                        </a>
                        <a href="about-en.html" className="text-gray-400 hover:text-white font-medium flex flex-col items-center">
                            <svg className="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            About
                        </a>
                        <a href="index.html" className="text-gray-400 hover:text-white font-medium flex flex-col items-center">
                            <svg className="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <span className="tracking-widest">HE</span>
                        </a>
                    </div>

                    {/* Profile Modal */}
                    {showProfileModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-md p-4 transition-opacity duration-300" onClick={() => setShowProfileModal(false)}>
                            <div className="relative max-w-4xl max-h-[90vh] bg-darkSurface rounded-2xl p-2 border-2 border-darkBorder shadow-2xl overflow-hidden" onClick={e => e.stopPropagation()}>
                                <button 
                                    type="button" 
                                    onClick={() => setShowProfileModal(false)}
                                    className="absolute top-4 left-4 z-[110] bg-darkBase/70 rounded-full p-3 text-gray-400 hover:text-white hover:bg-brandAccent/90 transition-colors focus:outline-none cursor-pointer" 
                                    aria-label="Close window"
                                >
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                </button>
                                <img src="assets/images/symbols/ram-profile.jpg" alt="Ram, full portrait image" className="w-full h-auto max-h-[85vh] object-contain rounded-lg shadow-inner" />
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
