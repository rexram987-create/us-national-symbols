<!DOCTYPE html>
<html lang="he" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ארכיון הסמלים הלאומיים של ארצות הברית</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: { 900: '#0a192f', 800: '#112240', 700: '#233554' },
                        gold: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' },
                    },
                    fontFamily: {
                        sans: ['Heebo', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Heebo', sans-serif; }
        h1, h2, h3, .serif-font { font-family: 'Playfair Display', serif; }
        .bg-pattern { background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); }
    </style>
</head>
<body class="bg-navy-900 text-slate-300 min-h-screen bg-pattern selection:bg-gold-500 selection:text-navy-900">
    <div id="root"></div>

    <script type="text/babel">
        // Symbol Data Array - Links updated perfectly to match GitHub screenshot
        const symbolsData = [
            {
                id: 'declaration',
                category: 'vision',
                title: 'הכרזת העצמאות',
                year: '1776',
                description: `המסמך שכונן את האומה ויצר את ה'אני מאמין' האמריקאי, בהובלתו של תומאס ג'פרסון.`,
                icon: 'scroll',
                image: 'assets/images/symbols/declaration-signatures.webp',
                link: 'symbols/declaration.html',
                isNew: true
            },
            {
                id: 'constitution',
                category: 'vision',
                title: 'חוקת ארצות הברית',
                year: '1787',
                description: `הסמל האזרחי העליון והחוזה המקודש של הרפובליקה, מבית מדרשו של ג'יימס מדיסון.`,
                icon: 'scale',
                image: 'assets/images/symbols/constitution.webp',
                link: 'symbols/constitution.html',
                isNew: false
            },
            {
                id: 'flag',
                category: 'identity',
                title: 'דגל ארצות הברית',
                year: '1777',
                description: `ההיסטוריה, המיתוס של בטסי רוס, והאבולוציה של 'הפסים והכוכבים'.`,
                icon: 'flag',
                image: 'assets/images/symbols/american-flag.webp',
                link: 'symbols/american-flag.html',
                isNew: false
            },
            {
                id: 'anthem',
                category: 'identity',
                title: 'ההמנון הלאומי',
                year: '1814',
                description: `'הדגל זרוע הכוכבים' - שיר שנולד בלב קרב ימי עקוב מדם במלחמת 1812.`,
                icon: 'music',
                image: 'assets/images/symbols/national-anthem.webp',
                link: 'symbols/national-anthem.html',
                isNew: false
            },
            {
                id: 'seal',
                category: 'identity',
                title: 'החותם הגדול',
                year: '1782',
                description: `הסמל הרשמי המשלב את העיט, עלי הזית והחצים. ההנדסה שמאחורי החותם.`,
                icon: 'stamp',
                image: 'assets/images/symbols/great-seal.webp',
                link: 'symbols/great-seal.html',
                isNew: false
            },
            {
                id: 'uncle-sam',
                category: 'identity',
                title: 'הדוד סם',
                year: '1812',
                description: `מסוחר בשר אלמוני מניו יורק לאייקון הגיוס המפורסם בעולם שעוצב על ידי ג'יימס פלאג.`,
                icon: 'user-circle',
                image: 'assets/images/symbols/uncle-sam.webp',
                link: 'symbols/uncle-sam.html',
                isNew: false
            },
            {
                id: 'eagle',
                category: 'nature',
                title: 'העיט הקירח',
                year: '1782',
                description: `הציפור הלאומית המסמלת חירות ועוצמה. כולל המחלוקת ההיסטורית עם בנג'מין פרנקלין.`,
                icon: 'bird',
                image: 'assets/images/symbols/bald-eagle.webp',
                link: 'symbols/bald-eagle.html',
                isNew: false
            },
            {
                id: 'bison',
                category: 'nature',
                title: 'הביזון האמריקאי',
                year: '2016',
                description: `היונק הלאומי. סמל לעוצמת הערבות, לטרגדיית ההכחדה ולמאמץ השימור הענק.`,
                icon: 'paw-print',
                image: 'assets/images/symbols/american-bison.webp',
                link: 'symbols/american-bison.html',
                isNew: false
            },
            {
                id: 'oak-tree',
                category: 'nature',
                title: 'עץ האלון',
                year: '2004',
                description: `העץ הלאומי המסמל חוזק, עמידות ושורשים עמוקים באדמה האמריקאית.`,
                icon: 'tree-pine',
                image: 'assets/images/symbols/oak-tree.webp',
                link: 'symbols/oak-tree.html',
                isNew: false
            },
            {
                id: 'rose',
                category: 'nature',
                title: 'הוורד',
                year: '1986',
                description: `הפרח הלאומי של ארצות הברית המסמל חיים, אהבה ומסירות. הוכרז רשמית בגן הוורדים.`,
                icon: 'flower-2',
                image: 'assets/images/symbols/rose.webp',
                link: 'symbols/rose.html',
                isNew: false
            },
            {
                id: 'apple-pie',
                category: 'nature',
                title: 'פאי תפוחים',
                year: '1800s',
                description: `הסמל הקולינרי הבלתי רשמי של ארצות הברית - 'As American as apple pie'.`,
                icon: 'chef-hat',
                image: 'assets/images/symbols/apple-pie.webp',
                link: 'symbols/apple-pie.html',
                isNew: false
            }
        ];

        // Component: Individual Card with Image
        const SymbolCard = ({ symbol }) => {
            React.useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [symbol]);

            return (
                <a href={symbol.link} className="group relative bg-navy-800/80 backdrop-blur-md border border-navy-600 rounded-2xl overflow-hidden flex flex-col h-full transition-all duration-300 hover:border-gold-500 hover:shadow-[0_0_20px_rgba(251,191,36,0.15)] hover:-translate-y-1 block">
                    
                    {/* Image Header Section */}
                    <div className="relative h-48 w-full overflow-hidden bg-navy-900">
                        <img 
                            src={symbol.image} 
                            alt={symbol.title} 
                            className="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-700"
                            onError={(e) => { 
                                e.target.onerror = null; 
                                e.target.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200"><rect width="400" height="200" fill="%23112240"/><text x="50%" y="50%" font-family="sans-serif" font-size="16" fill="%23fbbf24" text-anchor="middle" dominant-baseline="middle">תמונה תעודכן בקרוב</text></svg>'; 
                            }}
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-navy-800 via-navy-800/20 to-transparent"></div>
                        
                        {/* New Badge */}
                        {symbol.isNew && (
                            <div className="absolute top-3 right-3 bg-gold-500 text-navy-900 text-xs font-bold px-3 py-1 rounded-full shadow-lg border-2 border-navy-900 z-10 animate-pulse">
                                חדש!
                            </div>
                        )}
                        
                        {/* Icon Overlay */}
                        <div className="absolute top-3 left-3 p-2 bg-navy-900/80 backdrop-blur-sm rounded-xl border border-navy-700 text-gold-400 group-hover:bg-gold-500 group-hover:text-navy-900 transition-colors shadow-lg z-10">
                            <i data-lucide={symbol.icon} className="w-5 h-5"></i>
                        </div>
                    </div>

                    {/* Content Section */}
                    <div className="p-6 flex flex-col flex-grow bg-navy-800/80">
                        <div className="flex items-center justify-between mb-3">
                            <h3 className="text-xl font-bold text-white group-hover:text-gold-400 transition-colors">
                                {symbol.title}
                            </h3>
                            <span className="text-xs font-bold text-navy-400 bg-navy-900/50 px-3 py-1 rounded-full border border-navy-700/50">
                                {symbol.year}
                            </span>
                        </div>
                        <p className="text-slate-400 text-sm leading-relaxed mb-6 flex-grow">
                            {symbol.description}
                        </p>
                        <div className="flex items-center text-gold-500 font-medium text-sm group-hover:translate-x-[-4px] transition-transform w-fit mt-auto pt-4 border-t border-navy-700/50 w-full">
                            <i data-lucide="arrow-left" className="w-4 h-4 ml-1"></i>
                            קרא את המחקר המלא
                        </div>
                    </div>
                </a>
            );
        };

        // Component: Category Section
        const CategorySection = ({ title, icon, symbols }) => (
            <section className="mb-16">
                <div className="flex items-center gap-3 mb-8 border-b border-navy-700/50 pb-4">
                    <div className="p-2 bg-navy-800 rounded-lg text-gold-500 shadow-sm border border-navy-600">
                        <i data-lucide={icon} className="w-6 h-6"></i>
                    </div>
                    <h2 className="text-3xl font-bold text-white">{title}</h2>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {symbols.map(sym => <SymbolCard key={sym.id} symbol={sym} />)}
                </div>
            </section>
        );

        // Main App Component
        const App = () => {
            React.useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, []);

            const visionSymbols = symbolsData.filter(s => s.category === 'vision');
            const identitySymbols = symbolsData.filter(s => s.category === 'identity');
            const natureSymbols = symbolsData.filter(s => s.category === 'nature');

            return (
                <div>
                    <header className="absolute top-0 left-0 right-0 z-50 bg-navy-900/90 backdrop-blur-md border-b border-gold-500/20 shadow-lg">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-4">
                                <div className="p-2 bg-gold-500 text-navy-900 rounded-full shadow-[0_0_15px_rgba(251,191,36,0.5)]">
                                    <i data-lucide="library" className="w-6 h-6"></i>
                                </div>
                                <div>
                                    <h1 className="text-xl md:text-2xl font-bold text-white tracking-wide">ארכיון הסמלים הלאומיים</h1>
                                    <p className="text-xs md:text-sm text-gold-400 font-medium">ארצות הברית של אמריקה</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-4">
                                <a href="index-en.html" className="flex items-center justify-center w-10 h-10 bg-navy-800 text-white rounded-full font-bold hover:bg-gold-500 hover:text-navy-900 transition-colors border border-navy-700 shadow-sm" title="English">
                                    EN
                                </a>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 pt-32 pb-24">
                        <div className="text-center mb-16 relative">
                            <div className="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-1 bg-gradient-to-r from-transparent via-gold-500 to-transparent opacity-50"></div>
                            <h2 className="text-4xl md:text-5xl font-bold text-white mb-4 mt-6 leading-tight">חקור את המורשת האמריקאית</h2>
                            <p className="text-lg md:text-xl text-slate-400 max-w-2xl mx-auto font-light">
                                אוסף מקיף של מחקרים היסטוריים ואטימולוגיים על הסמלים המכוננים את זהותה של ארצות הברית.
                            </p>
                        </div>

                        <CategorySection title="החזון והחוק" icon="scale" symbols={visionSymbols} />
                        <CategorySection title="זהות לאומית וסמלים היסטוריים" icon="flag" symbols={identitySymbols} />
                        <CategorySection title="טבע, פולקלור ותרבות" icon="leaf" symbols={natureSymbols} />

                    </main>

                    <footer className="bg-navy-900/90 border-t border-navy-700 py-8">
                        <div className="max-w-7xl mx-auto px-4 text-center text-slate-500 text-sm">
                            <p>© 2026 ארכיון הסמלים הלאומיים. נבנה על ידי רם.</p>
                            <p className="mt-2 text-xs">עיצוב מותאם ל-Samsung S25 Ultra</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
